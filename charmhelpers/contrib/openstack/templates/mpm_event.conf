# Configuration file maintained by Juju. Local changes may be overwritten.
#
# Apache mpm_event tuning.
#
# NOTE: MPM directives apply to the whole Apache server instance; they cannot
# be scoped to a single VirtualHost.
#
# StartServers, MinSpareThreads, MaxSpareThreads and MaxConnectionsPerChild
# below match the Apache/Ubuntu packaged defaults and are included only so this
# file fully defines the module's behaviour. The operator-tunable directives
# are ThreadsPerChild, ServerLimit and MaxRequestWorkers, driven by the
# mpm-threads-per-child, mpm-server-limit and mpm-max-request-workers charm
# config options. ThreadLimit is kept >= ThreadsPerChild because it caps
# ThreadsPerChild and can only be set at server start.
<IfModule mpm_event_module>
    StartServers             2
    MinSpareThreads          25
    MaxSpareThreads          75
    ThreadLimit              {{ mpm_thread_limit }}
    ThreadsPerChild          {{ mpm_threads_per_child }}
    ServerLimit              {{ mpm_server_limit }}
    MaxRequestWorkers        {{ mpm_max_request_workers }}
    MaxConnectionsPerChild   0
</IfModule>
